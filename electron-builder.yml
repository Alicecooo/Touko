appId: com.openmausbot.app
productName: Touko
artifactName: Touko-${version}-${arch}.${ext}

protocols:
  - name: Touko package install
    schemes: [openmausbot]

# In-app auto-update reads latest-mac.yml + the .zip (macOS) or latest.yml +
# the NSIS .exe (Windows) from the PUBLIC releases in this source repo.
# Public → no token on users' machines. Baked into
# app-update.yml; both metadata files are emitted here even with
# --publish never, and must be uploaded to the GitHub release alongside the
# artifacts — a release missing latest.yml leaves every Windows install
# stranded on its installed version.
publish:
  - provider: github
    owner: Alicecooo
    repo: Touko

directories:
  buildResources: build
  output: release

# electron-builder makes copied directories group-writable by default. The
# Linux CUA trust boundary requires root-owned package ancestors to be 0755.
afterPack: ./scripts/build/after-pack.mjs

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the bundled harness server (esbuild → server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE (the agentcal-hq pattern).
files:
  - electron/**
  - "!electron/**/*.test.*"
  # The Teach a skill recorder is gone, but a machine that once ran
  # `pnpm build:recorder` may still hold its helper build; never ship it.
  - "!electron/resources/recorder-helper"
  - "!electron/resources/recorder-helper.swift"
  - "!electron/resources/recorder-helper-Info.plist"
  - "!electron/resources/OpenMausBot Recorder.app/**"
  - "!**/node_modules/**"
  - package.json

asar: true

extraResources:
  # Ship the app's own license terms in every desktop distribution.
  - from: LICENSE
    to: licenses/OpenMausBot-LICENSE.txt
  - from: NOTICE
    to: licenses/OpenMausBot-NOTICE.txt
  # cloudflared is distributed under Apache-2.0 as a separate executable.
  # OpenMausBot itself uses the same full license text; ship another named
  # copy so the third-party executable's terms remain unambiguous.
  - from: LICENSE
    to: licenses/cloudflared-LICENSE.txt
  - from: third_party/cloudflared/README.md
    to: licenses/cloudflared-README.md
  - from: third_party/hpke-js/core-LICENSE.txt
    to: licenses/hpke-core-LICENSE.txt
  - from: third_party/hpke-js/common-LICENSE.txt
    to: licenses/hpke-common-LICENSE.txt
  # The model provider catalog: models.dev data and OpenCode's refresh logic.
  - from: third_party/models-dev/LICENSE
    to: licenses/models-dev-LICENSE.txt
  - from: third_party/opencode/LICENSE
    to: licenses/opencode-LICENSE.txt
  # Code adapted from T3 Code (MIT): the Antigravity runtime and citations.
  - from: third_party/t3-code/LICENSE
    to: licenses/t3-code-LICENSE.txt
  # The 1Password SDK and its WebAssembly core (MIT; saved logins from
  # 1Password, staged in the server-runtime resource tree). Neither npm package
  # carries its license text, so the upstream file travels here.
  - from: third_party/onepassword-sdk/LICENSE
    to: licenses/1password-sdk-LICENSE.txt
  - from: dist
    to: ui
  - from: dist-server
    to: server
  - from: dist-native/server-runtime/node_modules
    to: server-runtime/node_modules
  - from: skills
    to: skills

win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  icon: build/icon.ico
  extraResources:
    - from: dist-native/cloudflared/win32-x64/cloudflared.exe
      to: cloudflared/cloudflared.exe
    # CUA driver and SDK for Windows — must live outside ASAR for native modules
    - from: dist-native/cua-win32-x64/cua-driver.exe
      to: cua-driver.exe
    - from: dist-native/cua-win32-x64/cua-driver-background.exe
      to: cua-driver-background.exe
    - from: dist-native/cua-win32-x64/cua-sdk
      to: cua-sdk
  # No signing config yet (would go under win.signtoolOptions or
  # win.azureSignOptions — eb 26 nests it, there is no top-level
  # win.certificateFile). The installer is unsigned, so SmartScreen shows
  # "unknown publisher" on first run (README says so). verifyUpdateCodeSignature
  # defaults true, but electron-updater skips the check when app-update.yml
  # carries no publisherName — so auto-update still works today. Do NOT set
  # publisherName without actually signing, or every update is rejected as
  # untrusted; and once signed, keep the cert subject stable (or list both old
  # and new in publisherName) or you strand already-installed users.

nsis:
  oneClick: true
  perMachine: false
  shortcutName: Touko
  # Versioned, like the .dmg. The README's /latest/download/ button needs a
  # STABLE filename, so ship a second copy named Touko-setup.exe on the release.
  artifactName: Touko-${version}-setup.${ext}

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  # Keep the self-contained SVG in the freedesktop scalable icon hierarchy. A
  # lone 1024px PNG is not indexed by GNOME's hicolor theme on Ubuntu 24.04.
  icon: public/app-icon.svg
  category: Utility
  executableName: openmausbot
  synopsis: Your own team of AI bots, in a chat app
  description: A local-first chat app for running a team of AI agents.
  maintainer: Milind Soni <46266943+milind-soni@users.noreply.github.com>
  vendor: Touko
  syncDesktopName: true
  # The reviewed x64 CLI runtime is staged before packaging and remains
  # outside ASAR so executable modes and adjacent sidecars are preserved.
  extraResources:
    - from: dist-native/cua-linux-x64
      to: cua-linux-x64
    - from: dist-native/cloudflared/linux-x64/cloudflared
      to: cloudflared/cloudflared
  desktop:
    entry:
      Name: Touko
      Comment: Your own team of AI bots, in a chat app
      Keywords: AI;Agents;Chat;Productivity;

deb:
  packageCategory: utils
  priority: optional

# Static AppImage runtime: Ubuntu 24.04 can launch it without legacy FUSE 2.
toolsets:
  appimage: "1.0.3"
